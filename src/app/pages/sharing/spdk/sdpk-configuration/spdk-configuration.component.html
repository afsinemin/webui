<ix-modal-header
  [requiredRoles]="requiredRoles"
  [title]="'SPDK Global Configuration' | translate"
  [loading]="isLoading()"
></ix-modal-header>

<mat-card>
  <mat-card-content>
    <form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
      <ix-fieldset>
        <ix-input
          formControlName="basenqn"
          [label]="'Base NQN' | translate"
          [tooltip]="helptext.baseNqnTooltip | translate"
        ></ix-input>
         <ix-input
          formControlName="worker_cores"
          [label]="'SPDK Worker Cores' | translate"
          [tooltip]="'Which Cores is Working for SPDK default value is 0xF (1, 2, 3, and 4)' | translate"
        ></ix-input>
         <ix-input
          formControlName="max_queue_depth"
          [label]="'SPDK max_queue_depth' | translate"
          [tooltip]="'max_queue_depth default value is 8192' | translate"
        ></ix-input>
       <ix-input
          formControlName="max_io_qpairs"
          [label]="'SPDK max_io_qpairs' | translate"
          [tooltip]="'max_io_qpairs default value is 8192' | translate"
        ></ix-input>
         <ix-input
          formControlName="in_caps"
          [label]="'SPDK in_caps' | translate"
          [tooltip]="'in_caps default value is 131072' | translate"
        ></ix-input> 

          <ix-input
          formControlName="num_shared_buffers"
          [label]="'SPDK num_shared_buffers' | translate"
          [tooltip]="'num_shared_buffers(RDMA) default value is 131072' | translate"
        ></ix-input> 
          <ix-input
          formControlName="huge_page_size"
          [label]="'SPDK huge_page_size' | translate"
          [tooltip]="'huge_page_size default value is 1024 MB' | translate"
        ></ix-input> 


        <ix-checkbox
          formControlName="ana"
          [label]="'Enable Asymmetric Namespace Access (ANA)' | translate"
          [matTooltip]="form.controls.ana.disabled ? (helptext.anaDisabledTooltip | translate) : ''"
        ></ix-checkbox>

        <ix-checkbox
          formControlName="rdma"
          [label]="'Enable Remote Direct Memory Access (RDMA)' | translate"
          [tooltip]="helptext.rdmaTooltip"
          [matTooltip]="form.controls.rdma.disabled ? (helptext.rdmaDisabledTooltip | translate) : ''"
        ></ix-checkbox>
      </ix-fieldset>

      <ix-form-actions>
        <button
          *ixRequiresRoles="requiredRoles"
          mat-button
          type="submit"
          color="primary"
          ixTest="save"
          [disabled]="form.invalid || isLoading()"
        >
          {{ 'Save' | translate }}
        </button>
      </ix-form-actions>
    </form>
  </mat-card-content>
</mat-card>
